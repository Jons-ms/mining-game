name: Deploy Firebase

# Manual only, and every run must be approved by the owner in the "production" environment before it gets any
# Google credentials. One step per run (see docs/DEPLOY.md). There are NO long-lived keys: Google access comes
# from GitHub OIDC (Workload Identity Federation). Google accepts the token only if ALL of these hold in the token:
# repository Jons-ms/mining-game, workflow_ref = this file on refs/heads/main, ref = refs/heads/main,
# event_name = workflow_dispatch, environment = production (the provider condition is in docs/DEPLOY.md, step 1.3).
# The repository is public, so logs are public: nothing here prints secrets or player data.
#
# Nothing here can delete functions or data: deploys name the functions explicitly and never use --force
# (without --force the Firebase CLI refuses to delete functions in non-interactive mode).
# The only --force in this file belongs to the separate, optional set-image-cleanup step (see the comment there).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Step to run"
        type: choice
        required: true
        options:
          - backup
          - migrate-dry-run
          - deploy-functions
          - set-image-cleanup
          - deploy-rules
          - migrate-apply
      confirm:
        description: "Type the step name again to confirm (for example: deploy-rules)"
        type: string
        required: true
      ref:
        description: "Branch with the code to deploy (server-migration or main)"
        type: string
        required: true
        default: server-migration

# No permissions by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  guard:
    # Cheap checks that fail BEFORE the approval request is sent and before any credential exists.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate the request
        env:
          STEP: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          CODE_REF: ${{ inputs.ref }}
          RUN_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$RUN_REF" = "refs/heads/main" ] || fail "Run this workflow from the main branch (got $RUN_REF)."
          [ "$ACTOR" = "$OWNER" ] || fail "Only the repository owner can run it."
          [ "$CONFIRM" = "$STEP" ] || fail "Confirmation does not match: type exactly '$STEP' in the 'confirm' field."
          case "$CODE_REF" in server-migration|main) ;; *) fail "ref must be server-migration or main." ;; esac
          case "$STEP" in backup|migrate-dry-run|deploy-functions|set-image-cleanup|deploy-rules|migrate-apply) ;; *) fail "Unknown step." ;; esac
          echo "Step '$STEP' on '$CODE_REF' is waiting for approval in the production environment."

  run:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewer on this environment = the owner. Nothing below starts until it is approved.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      STEP: ${{ inputs.action }}
      PROJECT_ID: cryp-togame
      STORAGE_BUCKET: cryp-togame.firebasestorage.app
      FUNCTIONS_REGION: europe-west1
      # The ONLY functions this workflow deploys. Must match the exports of functions/index.js (checked below).
      DEPLOY_ONLY: functions:initPlayer,functions:gameAction,functions:heartbeat,functions:openBankAccount,functions:hourlyPodium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Show exactly what will run
        run: |
          echo "Step:    $STEP"
          echo "Commit:  $(git rev-parse HEAD)"
          echo "Project: $PROJECT_ID"

      # Migration steps use a separate account that can only read/write Firestore data;
      # everything else uses the deploy account. Neither has a key.
      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ startsWith(inputs.action, 'migrate') && vars.GCP_MIGRATOR_SA || vars.GCP_DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        if: ${{ env.STEP == 'deploy-functions' || startsWith(env.STEP, 'migrate') }}
        run: npm install --prefix functions --no-audit --no-fund --ignore-scripts

      - name: Run server tests before touching Firebase
        if: ${{ env.STEP == 'deploy-functions' || env.STEP == 'migrate-apply' }}
        run: npm test --prefix functions

      - name: Install Firebase CLI (pinned)
        if: ${{ env.STEP == 'deploy-functions' || env.STEP == 'set-image-cleanup' || env.STEP == 'deploy-rules' }}
        run: npm install -g firebase-tools@15.37.0 --ignore-scripts

      - name: Run the step
        run: |
          case "$STEP" in
            backup)
              DEST="gs://$STORAGE_BUCKET/backups/firestore-$(date -u +%Y%m%d-%H%M%S)"
              gcloud firestore export "$DEST" --project="$PROJECT_ID"
              echo "Backup written to $DEST" ;;
            migrate-dry-run)
              node scripts/migrate-players.js ;;
            deploy-functions)
              # 1) The list in DEPLOY_ONLY must equal the functions exported by the code, so nothing is silently skipped or added.
              EXPORTED=$(grep -oE '^exports\.[A-Za-z0-9_]+ = on(Call|Request|Schedule)' functions/index.js | sed -E 's/^exports\.([A-Za-z0-9_]+) = .*/functions:\1/' | sort | paste -sd, -)
              WANTED=$(echo "$DEPLOY_ONLY" | tr ',' '\n' | sort | paste -sd, -)
              if [ "$EXPORTED" != "$WANTED" ]; then
                echo "::error::DEPLOY_ONLY does not match the functions in functions/index.js"; echo "code:     $EXPORTED"; echo "workflow: $WANTED"; exit 1
              fi
              # 2) Read-only look at what already exists in production (public log: function names only).
              echo "Functions that already exist in $PROJECT_ID:"
              firebase functions:list --project "$PROJECT_ID" --non-interactive
              # 3) Deploy ONLY the named functions, without --force. In non-interactive mode the Firebase CLI aborts instead of
              #    deleting any function that is missing from the code, and --only keeps every other function out of the plan.
              firebase deploy --only "$DEPLOY_ONLY" --project "$PROJECT_ID" --non-interactive ;;
            set-image-cleanup)
              # Optional. Sets the Artifact Registry cleanup policy (old build images are deleted after 7 days) for the functions
              # repository. This is the only command here with --force; it makes the CLI skip its confirmation for creating
              # that cleanup policy and cannot touch functions or Firestore data. Needs the extra role from docs/DEPLOY.md.
              firebase functions:artifacts:setpolicy --days 7 --location "$FUNCTIONS_REGION" --force --project "$PROJECT_ID" --non-interactive ;;
            deploy-rules)
              firebase deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive ;;
            migrate-apply)
              node scripts/migrate-players.js --apply ;;
            *)
              echo "::error::Unknown step: $STEP"; exit 1 ;;
          esac
