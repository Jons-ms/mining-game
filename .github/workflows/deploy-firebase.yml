name: Deploy Firebase

# Manual only, and every run must be approved by the owner in the "production" environment before it gets any
# Google credentials. One step per run (see docs/DEPLOY.md). There are NO long-lived keys: Google access comes
# from GitHub OIDC (Workload Identity Federation). Google accepts the token only if ALL of these hold in the token:
# repository Jons-ms/mining-game, workflow_ref = this file on refs/heads/main, ref = refs/heads/main,
# event_name = workflow_dispatch, environment = production (the provider condition is in docs/DEPLOY.md, step 1.3).
# The repository is public, so logs are public: nothing here prints secrets or player data.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Step to run"
        type: choice
        required: true
        options:
          - backup
          - migrate-dry-run
          - deploy-functions
          - deploy-rules
          - migrate-apply
      confirm:
        description: "Type the step name again to confirm (for example: deploy-rules)"
        type: string
        required: true
      ref:
        description: "Branch with the code to deploy (server-migration or main)"
        type: string
        required: true
        default: server-migration

# No permissions by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  guard:
    # Cheap checks that fail BEFORE the approval request is sent and before any credential exists.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate the request
        env:
          STEP: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          CODE_REF: ${{ inputs.ref }}
          RUN_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$RUN_REF" = "refs/heads/main" ] || fail "Run this workflow from the main branch (got $RUN_REF)."
          [ "$ACTOR" = "$OWNER" ] || fail "Only the repository owner can run it."
          [ "$CONFIRM" = "$STEP" ] || fail "Confirmation does not match: type exactly '$STEP' in the 'confirm' field."
          case "$CODE_REF" in server-migration|main) ;; *) fail "ref must be server-migration or main." ;; esac
          case "$STEP" in backup|migrate-dry-run|deploy-functions|deploy-rules|migrate-apply) ;; *) fail "Unknown step." ;; esac
          echo "Step '$STEP' on '$CODE_REF' is waiting for approval in the production environment."

  run:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewer on this environment = the owner. Nothing below starts until it is approved.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      STEP: ${{ inputs.action }}
      PROJECT_ID: cryp-togame
      STORAGE_BUCKET: cryp-togame.firebasestorage.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Show exactly what will run
        run: |
          echo "Step:    $STEP"
          echo "Commit:  $(git rev-parse HEAD)"
          echo "Project: $PROJECT_ID"

      # Migration steps use a separate account that can only read/write Firestore data;
      # everything else uses the deploy account. Neither has a key.
      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ startsWith(inputs.action, 'migrate') && vars.GCP_MIGRATOR_SA || vars.GCP_DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        if: ${{ env.STEP == 'deploy-functions' || startsWith(env.STEP, 'migrate') }}
        run: npm install --prefix functions --no-audit --no-fund --ignore-scripts

      - name: Run server tests before touching Firebase
        if: ${{ env.STEP == 'deploy-functions' || env.STEP == 'migrate-apply' }}
        run: npm test --prefix functions

      - name: Install Firebase CLI (pinned)
        if: ${{ env.STEP == 'deploy-functions' || env.STEP == 'deploy-rules' }}
        run: npm install -g firebase-tools@15.37.0 --ignore-scripts

      - name: Run the step
        run: |
          case "$STEP" in
            backup)
              DEST="gs://$STORAGE_BUCKET/backups/firestore-$(date -u +%Y%m%d-%H%M%S)"
              gcloud firestore export "$DEST" --project="$PROJECT_ID"
              echo "Backup written to $DEST" ;;
            migrate-dry-run)
              node scripts/migrate-players.js ;;
            deploy-functions)
              firebase deploy --only functions --project "$PROJECT_ID" --non-interactive --force ;;
            deploy-rules)
              firebase deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive ;;
            migrate-apply)
              node scripts/migrate-players.js --apply ;;
            *)
              echo "::error::Unknown step: $STEP"; exit 1 ;;
          esac
